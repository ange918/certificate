<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTUR Certify - Administration</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#0b1d3a',
                        'cyan': '#00ffff',
                        'orange': '#ff7f00'
                    },
                    fontFamily: {
                        'montserrat': ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy min-h-screen font-montserrat">
    <!-- Header -->
    <header class="bg-navy border-b border-cyan/20 py-6">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-gradient-to-r from-cyan to-orange rounded-lg flex items-center justify-center">
                        <i class="fas fa-user-shield text-navy text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white">Administration FUTUR</h1>
                        <p class="text-cyan text-sm">Gestion des Certificats</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-cyan hover:text-white transition-colors">
                        <i class="fas fa-home mr-2"></i>Accueil
                    </a>
                    <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                        <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-navy border border-cyan/20 rounded-2xl p-8 w-full max-w-md mx-4">
            <div class="text-center mb-8">
                <i class="fas fa-lock text-4xl text-cyan mb-4"></i>
                <h2 class="text-2xl font-bold text-white mb-2">Accès Administrateur</h2>
                <p class="text-gray-300">Entrez le mot de passe pour continuer</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        placeholder="Mot de passe"
                        class="w-full px-4 py-3 bg-white/10 border border-cyan/30 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-cyan focus:ring-2 focus:ring-cyan/20 transition-all"
                        required
                    >
                </div>
                
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-cyan to-orange hover:from-cyan/80 hover:to-orange/80 text-navy font-semibold py-3 rounded-lg transition-all transform hover:scale-105"
                >
                    Se connecter
                </button>
            </form>
            
            <div id="loginError" class="hidden mt-4 p-3 bg-red-600/20 border border-red-600/30 rounded-lg text-red-400 text-sm text-center">
                Mot de passe incorrect
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="adminContent" class="hidden container mx-auto px-4 py-8">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white/5 backdrop-blur-sm rounded-xl p-6 border border-cyan/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-300 text-sm">Total Étudiants</p>
                        <p id="totalStudents" class="text-3xl font-bold text-white">0</p>
                    </div>
                    <i class="fas fa-users text-cyan text-2xl"></i>
                </div>
            </div>
            
            <div class="bg-white/5 backdrop-blur-sm rounded-xl p-6 border border-cyan/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-300 text-sm">Certificats Actifs</p>
                        <p id="activeCertificates" class="text-3xl font-bold text-white">0</p>
                    </div>
                    <i class="fas fa-certificate text-orange text-2xl"></i>
                </div>
            </div>
            
            <div class="bg-white/5 backdrop-blur-sm rounded-xl p-6 border border-cyan/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-300 text-sm">Filières</p>
                        <p id="totalFilieres" class="text-3xl font-bold text-white">7</p>
                    </div>
                    <i class="fas fa-graduation-cap text-cyan text-2xl"></i>
                </div>
            </div>
        </div>

        <!-- Add Student Form -->
        <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-8 border border-cyan/20 mb-8">
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center">
                <i class="fas fa-user-plus text-cyan mr-3"></i>
                Ajouter un Étudiant
            </h2>
            
            <form id="addStudentForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">Prénom</label>
                        <input 
                            type="text" 
                            id="prenom" 
                            required
                            class="w-full px-4 py-3 bg-white/10 border border-cyan/30 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-cyan focus:ring-2 focus:ring-cyan/20 transition-all"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">Nom</label>
                        <input 
                            type="text" 
                            id="nom" 
                            required
                            class="w-full px-4 py-3 bg-white/10 border border-cyan/30 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-cyan focus:ring-2 focus:ring-cyan/20 transition-all"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">Matricule</label>
                        <input 
                            type="text" 
                            id="matricule" 
                            placeholder="FUT2024001"
                            required
                            class="w-full px-4 py-3 bg-white/10 border border-cyan/30 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-cyan focus:ring-2 focus:ring-cyan/20 transition-all"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">Photo</label>
                        <div class="relative">
                            <input 
                                type="file" 
                                id="photo" 
                                accept="image/*"
                                class="hidden"
                            >
                            <label 
                                for="photo" 
                                class="w-full px-4 py-3 bg-white/10 border border-cyan/30 rounded-lg text-white cursor-pointer flex items-center justify-center transition-all hover:border-cyan focus:outline-none focus:border-cyan focus:ring-2 focus:ring-cyan/20"
                            >
                                <i class="fas fa-upload mr-2"></i>
                                <span id="photoLabel">Choisir une photo</span>
                            </label>
                        </div>
                        <div id="photoPreview" class="hidden mt-3">
                            <img id="previewImage" class="w-20 h-20 rounded-full object-cover border-2 border-cyan" alt="Aperçu">
                        </div>
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-4">Filières (sélection multiple)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="Développement Web" class="w-4 h-4 text-cyan bg-transparent border-cyan/30 rounded focus:ring-cyan focus:ring-2">
                            <span class="text-gray-300">Développement Web</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="Data Science" class="w-4 h-4 text-cyan bg-transparent border-cyan/30 rounded focus:ring-cyan focus:ring-2">
                            <span class="text-gray-300">Data Science</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="Cybersécurité" class="w-4 h-4 text-cyan bg-transparent border-cyan/30 rounded focus:ring-cyan focus:ring-2">
                            <span class="text-gray-300">Cybersécurité</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="Intelligence Artificielle" class="w-4 h-4 text-cyan bg-transparent border-cyan/30 rounded focus:ring-cyan focus:ring-2">
                            <span class="text-gray-300">Intelligence Artificielle</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="DevOps" class="w-4 h-4 text-cyan bg-transparent border-cyan/30 rounded focus:ring-cyan focus:ring-2">
                            <span class="text-gray-300">DevOps</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="Mobile Development" class="w-4 h-4 text-cyan bg-transparent border-cyan/30 rounded focus:ring-cyan focus:ring-2">
                            <span class="text-gray-300">Mobile Development</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="Cloud Computing" class="w-4 h-4 text-cyan bg-transparent border-cyan/30 rounded focus:ring-cyan focus:ring-2">
                            <span class="text-gray-300">Cloud Computing</span>
                        </label>
                    </div>
                </div>
                
                <div class="flex justify-end">
                    <button 
                        type="submit"
                        class="bg-gradient-to-r from-cyan to-orange hover:from-cyan/80 hover:to-orange/80 text-navy font-semibold px-8 py-3 rounded-lg transition-all transform hover:scale-105"
                    >
                        <i class="fas fa-plus mr-2"></i>Ajouter l'Étudiant
                    </button>
                </div>
            </form>
        </div>

        <!-- Students List -->
        <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-8 border border-cyan/20">
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center">
                <i class="fas fa-list text-cyan mr-3"></i>
                Liste des Étudiants
            </h2>
            
            <div id="studentsList" class="space-y-4">
                <!-- Students will be loaded here -->
            </div>
            
            <div id="noStudents" class="text-center py-12 text-gray-400">
                <i class="fas fa-users text-4xl mb-4"></i>
                <p>Aucun étudiant enregistré</p>
            </div>
        </div>
    </main>

    <!-- Success/Error Messages -->
    <div id="notification" class="fixed top-4 right-4 z-50 hidden">
        <div class="bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="notificationText"></span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="admin.js"></script>
</body>
</html>
